[project]
name = "transcriptor"
version = "0.1.0"
description = "Oyente: transcribe tus clases en vivo y las guarda como notas de Obsidian."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "mcanil1999", email = "mcanil1999@gmail.com" }]
dependencies = [
    # Núcleo
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "platformdirs>=4.2",
    "keyring>=25.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
    "rapidfuzz>=3.9",
    "icalendar>=6.0",
    "watchdog>=4.0",
    "psutil>=6.0",
    # Audio
    "sounddevice>=0.5",
    "soundcard>=0.4.3; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "pyobjc-framework-ScreenCaptureKit>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    # Transcripción
    "faster-whisper>=1.1",
    # LLM (SDKs oficiales)
    "anthropic>=0.70",
    "google-genai>=1.0",
    # Google Calendar + Tasks
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    # Interfaz
    "nicegui>=2.0",
    "pywebview>=5.2",
    "pystray>=0.19",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Motor nativo para Mac con Apple Silicon
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Huella de voz ECAPA-TDNN (sin esto se usa un extractor local más simple)
speakers = ["speechbrain>=1.0", "torch>=2.3", "torchaudio>=2.3"]
# Embeddings BGE-M3 y KeyBERT (sin esto se usa un embedder ligero sin dependencias)
embeddings = ["sentence-transformers>=3.0", "keybert>=0.8"]
# Diarización avanzada (requiere token de Hugging Face)
pyannote = ["pyannote.audio>=3.3"]
full = ["transcriptor[mlx,speakers,embeddings]"]

[project.scripts]
oyente = "transcriptor.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "pip-licenses>=5.0",
]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriptor"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM105"]

[tool.mypy]
python_version = "3.12"
packages = ["transcriptor"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not slow and not live and not manual'"
asyncio_mode = "auto"
markers = [
    "slow: pruebas lentas (descargan o usan modelos reales)",
    "live: usan servicios reales y cuestan dinero (claves de API)",
    "manual: requieren hardware o interacción manual",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["transcriptor"]
omit = ["src/transcriptor/ui/*", "src/transcriptor/audio/sources/platform_*"]
