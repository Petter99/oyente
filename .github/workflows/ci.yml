# Pruebas automáticas. Repositorio privado: los minutos son limitados y los de Windows y macOS
# cuentan más, así que en cada PR solo se usa Windows (la plataforma de los usuarios).
# macOS se prueba en el Mac de desarrollo (uv run pytest) y aquí solo al etiquetar versiones.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Dependencias
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tipos
        run: uv run mypy
      - name: Pruebas (rápidas, sin red ni hardware)
        run: uv run pytest -q --cov=transcriptor --cov-report=term
      - name: Licencias (lista para vender)
        run: uv run python scripts/check_licenses.py
      - name: Secretos
        # gitleaks-action@v2 siempre descarga el .tar.gz, pero las releases de Windows son
        # .zip -> 404 en runners windows-latest (gitleaks/gitleaks-action#122, sin resolver).
        # Se descarga y ejecuta el binario directamente (misma versión que .pre-commit-config.yaml).
        shell: pwsh
        run: |
          $version = "8.21.2"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" -OutFile gitleaks.zip
          Expand-Archive gitleaks.zip -DestinationPath gitleaks-bin
          & ".\gitleaks-bin\gitleaks.exe" detect --source . --redact --no-banner
