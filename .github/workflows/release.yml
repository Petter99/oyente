# Al etiquetar una versión (v1.2.3): pruebas en macOS y compilación opcional en la nube.
# Lo habitual es compilar el instalador de Windows en el PC Windows (scripts/build-windows.ps1);
# este flujo existe por si el cupo de minutos del plan lo permite.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  windows-installer:
    if: ${{ vars.BUILD_IN_CLOUD == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Compilar instalador
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*-Setup-*.exe
