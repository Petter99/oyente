repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: pytest-rapido
        name: pruebas unitarias
        entry: uv run pytest -q tests/unit
        language: system
        pass_filenames: false
        stages: [pre-push]
