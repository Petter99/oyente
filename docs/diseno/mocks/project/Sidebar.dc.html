<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","clases","chat","ajustes"],"default":"inicio"},"platform":{"editor":"enum","options":["mac","win"],"default":"mac"},"$preview":{"width":232,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'inicio';
    const base = 'display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 7px; color: #1D1D1F; text-decoration: none; font-size: 13px;';
    const on = base + ' background: #DEDCD8; font-weight: 600;';
    const s = (k) => (active === k ? on : base);
    const win = (this.props.platform ?? 'mac') === 'win';
    return {
      mac: !win,
      win: win,
      sInicio: s('inicio'),
      sClases: s('clases'),
      sChat: s('chat'),
      sAjustes: s('ajustes')
    };
  }
}
</script>
