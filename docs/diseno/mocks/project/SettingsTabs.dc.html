  renderVals() {

    const names = { general: 'General', audio: 'Audio', trans: 'Transcripción', habl: 'Hablantes', ia: 'IA', obs: 'Obsidian', google: 'Google', uni: 'Calendarios de la universidad' };
    return {
      titulo: names[a] || 'Configuración',
      sGeneral: s('general'), sAudio: s('audio'), sTrans: s('trans'), sHabl: s('habl'),
      sIA: s('ia'), sObs: s('obs'), sGoogle: s('google'), sUni: s('uni')
    };
